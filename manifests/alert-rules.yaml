apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: platform.rules
      rules:
        - alert: VLLMDown
          expr: kube_deployment_status_replicas_available{deployment="vllm"} < 1
          for: 30s
          labels:
            severity: critical
            namespace: default
            annotations:
              summary: "vLLM has no available replicas"
              description: "The vLLM deployment has fewer than 1 available replica."