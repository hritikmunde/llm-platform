apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: platform.rules
      rules:
        - alert: VLLMDown
          expr: kube_deployment_status_replicas_available{deployment="vllm"} < 1
          for: 30s
          labels:
            severity: critical
            namespace: default
          annotations:
            summary: "vLLM has no available replicas"
            description: "The vLLM deployment has fewer than 1 available replica."
        - alert: VLLMCrashLooping
          expr: max by (namespace) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace="default"}) > 0
          for: 1m
          labels:
            severity: critical
            deployment: vllm
            namespace: default
          annotations:
            summary: "vLLM is crash-looping"
            description: "A vLLM container in default is in CrashLoopBackOff — likely a bad config."