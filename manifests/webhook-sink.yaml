apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  labels:
    app: webhook-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
    spec:
      containers:
        - name: webhook-sink
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
spec:
  selector:
    app: webhook-sink
  ports:
    - port: 80
      targetPort: 8080