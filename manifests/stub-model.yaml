apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-model
  labels:
    app: stub-model
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stub-model
  template:
    metadata:
      labels:
        app: stub-model
    spec:
      containers:
        - name: stub-model
          image: hashicorp/http-echo:1.0
          args:
            - "-text=stub model responding OK"
            - "-listen=:5678"
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "63Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stub-model
spec:
  type: NodePort
  selector:
    app: stub-model
  ports:
    - port: 80
      targetPort: 5678
      nodePort: 30080

